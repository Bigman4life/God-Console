<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>God Console</title>
<style>
  :root { --fg: #e8e8e8; --dim: #6a6a6a; --accent: #9fd2ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: var(--fg);
    cursor: default;
  }
  #stage { position: fixed; inset: 0; display: block; }

  /* Console */
  #console {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 22px 22px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    transition: opacity 1.2s ease;
    z-index: 10;
  }
  #console.observing { opacity: 0.0; }
  #console.observing:hover { opacity: 1; }
  .rule { color: var(--dim); user-select: none; letter-spacing: 1px; }
  #log { max-height: 28vh; overflow-y: auto; margin: 6px 0; font-size: 13px; line-height: 1.55; }
  #log::-webkit-scrollbar { width: 0; }
  .line { white-space: pre-wrap; }
  .line.you { color: var(--fg); }
  .line.sys { color: var(--accent); opacity: 0.9; }
  .line.dim { color: var(--dim); }
  #promptRow { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  #promptRow .caret { color: var(--accent); }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; caret-color: var(--accent);
  }
  #blink { width: 9px; height: 17px; background: var(--accent);
    animation: blink 1.05s steps(2) infinite; }
  @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  /* Boot / first-run hint */
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: var(--dim); font-size: 14px; text-align: center; z-index: 5;
    transition: opacity 1.5s ease; letter-spacing: 2px; }
  #hint.gone { opacity: 0; }

  /* Status (companion OS-style readout) */
  #status { position: fixed; top: 16px; right: 20px; text-align: right;
    font-size: 11px; color: var(--dim); line-height: 1.7; z-index: 8;
    transition: opacity .8s ease; pointer-events: none; }
  #status b { color: var(--accent); font-weight: 500; }
  #zoom { position: fixed; top: 16px; left: 20px; font-size: 11px;
    color: var(--dim); z-index: 8; letter-spacing: 1px; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hint">Create.</div>

  <div id="zoom"></div>
  <div id="status"></div>

  <div id="console">
    <div class="rule">───────────────────────────────────────────────────────────────</div>
    <div id="log"></div>
    <div id="promptRow">
      <span class="caret">&gt;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
      <div id="blink"></div>
    </div>
    <div class="rule">───────────────────────────────────────────────────────────────</div>
  </div>

<script>
/* =========================================================================
   GOD CONSOLE — vertical slice
   Architecture mirrors the design doc, scaled to one file:
     - Interpreter:  sentence -> intent {verb, target, params}
     - World State:  single source of truth + history (undo) + "it" memory
     - Sim Layer:    physics/time advance each frame
     - Renderer:     progressive, animated canvas (creation "assembles")
   The interpreter here is deterministic/keyword-based. Swapping it for an
   LLM that emits the SAME intent objects is the "ultra code" upgrade path.
   ========================================================================= */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; CX=W/2; CY=H/2; }
addEventListener('resize', resize); resize();

const rand = (a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- World State ---------------- */
const ZOOM_LEVELS = ["Quantum","Atom","Object","Room","Building","Street",
  "City","Country","Planet","Solar System","Galaxy","Universe"];

const World = {
  born: false,
  timeScale: 1,          // years per second of sim
  age: 0,                // accumulated "years"
  gravity: 1,            // in G
  zoom: 8,               // index into ZOOM_LEVELS (Planet)
  stars: [],             // background starfield
  particles: [],         // creation burst / debris
  bodies: [],            // sun, planet, moons (orbiting)
  climate: "temperate",  // temperate | ice | volcanic | ocean
  oceanColor: "#2a6db0",
  landColor: "#3c6b3a",
  skyTint: [10,12,30],
  lightCore: null,       // the genesis point
  it: null,              // last-referenced body for "make it ..."
  events: [],            // emergent log
};

let history = [];
function snapshot(){
  history.push(JSON.stringify({
    timeScale:World.timeScale, age:World.age, gravity:World.gravity,
    zoom:World.zoom, climate:World.climate, oceanColor:World.oceanColor,
    landColor:World.landColor, skyTint:[...World.skyTint],
    bodies: World.bodies.map(b=>({...b})), born:World.born
  }));
  if(history.length>40) history.shift();
}
function undo(){
  if(history.length<2){ sys("Nothing to undo. Reality holds."); return; }
  history.pop();
  const s = JSON.parse(history[history.length-1]);
  Object.assign(World, s);
  World.it = World.bodies.find(b=>b.kind==='planet') || null;
  sys("Reality reverted one step.");
}

/* ---------------- Console I/O ---------------- */
const logEl = document.getElementById('log');
const input = document.getElementById('cmd');
const hint  = document.getElementById('hint');
const consoleEl = document.getElementById('console');
const statusEl = document.getElementById('status');
const zoomEl = document.getElementById('zoom');

function line(text, cls){ const d=document.createElement('div'); d.className='line '+(cls||''); d.textContent=text; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
function you(t){ line('> '+t,'you'); }
function sys(t){ line(t,'sys'); }
function dim(t){ line(t,'dim'); }

/* Observing mode: UI fades while watching, returns on activity */
let observeTimer;
function poke(){
  consoleEl.classList.remove('observing');
  clearTimeout(observeTimer);
  observeTimer=setTimeout(()=>consoleEl.classList.add('observing'), 6000);
}
['mousemove','keydown','click'].forEach(e=>addEventListener(e,poke)); poke();

/* ---------------- Renderer helpers ---------------- */
function makeStarfield(n){
  World.stars=[];
  for(let i=0;i<n;i++) World.stars.push({
    x:Math.random(), y:Math.random(), z:rand(.3,1), tw:rand(0,Math.PI*2)
  });
}
function burst(n, power){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), s=rand(.5,power);
    World.particles.push({x:CX,y:CY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1, decay:rand(.004,.012), r:rand(.6,2.4),
      c:[255,rand(200,255),rand(150,255)]});
  }
}

/* progressive build queue: staged actions fire over seconds */
let buildQueue=[];
function stage(delay, fn){ buildQueue.push({t:performance.now()+delay, fn, done:false}); }
function runQueue(now){
  for(const s of buildQueue){ if(!s.done && now>=s.t){ s.done=true; s.fn(); } }
  buildQueue = buildQueue.filter(s=>!s.done);
}

/* ---------------- Creation routines ---------------- */
function genesis(){
  World.born=true;
  hint.classList.add('gone');
  World.lightCore={r:0, max:Math.min(W,H)*0.5, glow:0};
  makeStarfield(0);
  sys("...");
  // The mesmerizing assembly timeline
  stage(120, ()=>{ burst(140, 7); });
  stage(120, ()=>{ World.lightCore.glow=1; });
  stage(900, ()=>{ sys("Light."); });
  stage(1400,()=>{ makeStarfield(420); sys("Space unfolds."); });
  stage(2200,()=>{ spawnSun(); sys("A star ignites."); });
  stage(3200,()=>{ spawnPlanet(); sys("Matter gathers into a world."); });
  stage(4200,()=>{ World.it=World.bodies.find(b=>b.kind==='planet');
                   sys("Reality online. The console is yours."); });
  stage(4400,()=>{ snapshot(); });
}

function spawnSun(){
  World.bodies.push({kind:'sun', x:CX-260, y:CY-150, r:34, baseR:34,
    color:'#ffd27f', born:performance.now()});
}
function spawnPlanet(opts={}){
  const p={kind:'planet', cx:CX, cy:CY, orbit:0, ang:0, speed:0.06,
    r:0, targetR:opts.r||78, baseR:opts.r||78, x:CX, y:CY,
    spin:0, born:performance.now()};
  World.bodies.push(p);
  World.it=p;
  return p;
}
function spawnMoon(){
  const planet=World.bodies.find(b=>b.kind==='planet'); if(!planet) return;
  const n=World.bodies.filter(b=>b.kind==='moon').length;
  World.bodies.push({kind:'moon', ang:rand(0,6.28), dist:120+n*38,
    speed:rand(.4,.8)*(Math.random()<.5?1:-1), r:rand(7,13),
    x:0,y:0, color:'#cfcfcf', born:performance.now(), grow:0});
}

/* ---------------- Intent interpreter ----------------
   sentence -> {verb, params}. Deterministic & extensible.
   Replace this function with an LLM call returning the same shape
   to unlock true open-ended language ("ultra code"). */
function interpret(raw){
  const t=raw.toLowerCase().trim();
  const has=(...w)=>w.some(x=>t.includes(x));
  const num=()=>{ const m=t.match(/(\d+(\.\d+)?)/); return m?parseFloat(m[1]):null; };

  if(!World.born){
    if(has('light','create','let there be','begin','genesis','start','exist'))
      return {verb:'genesis'};
    return {verb:'genesis'}; // any first command sparks creation
  }
  if(has('undo','revert')) return {verb:'undo'};
  if(has('save')) return {verb:'save'};
  if(has('pause','freeze','stop time')) return {verb:'time', params:{scale:0}};
  if(has('accelerate','advance','fast forward','speed up time')){
    const n=num(); return {verb:'time', params:{scale:n? clamp(n,1,1e6) : 5000}};
  }
  if(has('resume','play','normal time')) return {verb:'time', params:{scale:1}};
  if(has('gravity')){
    if(has('remove','zero','no ')) return {verb:'gravity', params:{g:0}};
    const n=num(); return {verb:'gravity', params:{g:n!=null?n:World.gravity*2}};
  }
  if(has('moon')){ const n=num()||1; return {verb:'moon', params:{count:clamp(n,1,6)}}; }
  if(has('ice age','freeze','snow','glacial')) return {verb:'climate', params:{type:'ice'}};
  if(has('volcan','lava','obsidian','molten')) return {verb:'climate', params:{type:'volcanic'}};
  if(has('ocean world','water world','ocean planet','flood')) return {verb:'climate', params:{type:'ocean'}};
  if(has('sun','star')){
    if(has('double','bigger','grow','larger')) return {verb:'sun', params:{mul:2}};
    if(has('smaller','shrink')) return {verb:'sun', params:{mul:0.5}};
  }
  if(has('ocean','water','sea')){ const c=colorFrom(t); if(c) return {verb:'ocean', params:{color:c}}; }
  if(has('land','grass','terrain','forest')){ const c=colorFrom(t); if(c) return {verb:'land', params:{color:c}}; }
  if(has('darker','dark','dim it','night')) return {verb:'brightness', params:{d:-1}};
  if(has('brighter','lighter','brighten')) return {verb:'brightness', params:{d:1}};
  if(has('zoom out','zoom-out')) return {verb:'zoom', params:{d:1}};
  if(has('zoom in','zoom-in')) return {verb:'zoom', params:{d:-1}};
  if(has('life','species','civiliz','intelligent','creatures')) return {verb:'life'};
  if(has('planet','world','earth')) return {verb:'planet'};
  if(has('help','what can','commands')) return {verb:'help'};
  return {verb:'unknown', params:{raw}};
}

function colorFrom(t){
  const map={purple:'#7b3fc4',red:'#b03a3a',green:'#2e8b3a',blue:'#2a6db0',
    black:'#101015',white:'#dfe6ee',gold:'#c8a84b',crimson:'#8b1e1e',
    teal:'#1e8b8b',pink:'#c45f8e',orange:'#c8761f',silver:'#b9c0c8'};
  for(const k in map) if(t.includes(k)) return map[k];
  return null;
}

/* ---------------- Execute intent ---------------- */
function execute(it){
  switch(it.verb){
    case 'genesis': genesis(); break;
    case 'undo': undo(); break;
    case 'save': {
      const blob=new Blob([history[history.length-1]||'{}'],{type:'application/json'});
      const u=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=u; a.download='universe.json'; a.click(); URL.revokeObjectURL(u);
      sys("Universe archived. Its history persists.");
      break; }
    case 'time': {
      World.timeScale=it.params.scale;
      sys(it.params.scale===0 ? "Time paused. Clouds hang midair."
        : it.params.scale<=1 ? "Time flows normally."
        : `Time accelerated — ${fmt(it.params.scale)} years per second.`);
      break; }
    case 'gravity': {
      const g=it.params.g; World.gravity=g; snapshot();
      if(g===0){ sys("Gravity removed. Matter drifts free.");
        const p=World.bodies.find(b=>b.kind==='planet');
        if(p) for(let i=0;i<60;i++){ const a=rand(0,6.28), s=rand(.3,1.6);
          World.particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
            life:1,decay:.003,r:rand(1,3),c:hexRGB(World.landColor)}); }
      } else sys(`Gravity set to ${g}G. The world adjusts.`);
      break; }
    case 'moon': {
      for(let i=0;i<it.params.count;i++) stage(i*350,()=>spawnMoon());
      sys(`The sky tears open — ${it.params.count} moon${it.params.count>1?'s':''} emerge. Tides shift.`);
      snapshot(); break; }
    case 'climate': setClimate(it.params.type); break;
    case 'sun': {
      const s=World.bodies.find(b=>b.kind==='sun');
      if(s){ s.baseR=clamp(s.baseR*it.params.mul,12,140);
        sys(it.params.mul>1?"The sun swells. Temperature climbs, ice melts."
                            :"The sun dims and shrinks. A chill sets in."); }
      snapshot(); break; }
    case 'ocean': World.oceanColor=it.params.color; sys("The oceans change hue."); snapshot(); break;
    case 'land':  World.landColor =it.params.color; sys("The land takes on a new color."); snapshot(); break;
    case 'brightness': {
      const d=it.params.d*8;
      World.skyTint=World.skyTint.map((c,i)=>clamp(c+d,2,90));
      sys(d<0?"The world darkens.":"The world brightens."); snapshot(); break; }
    case 'zoom': {
      World.zoom=clamp(World.zoom+it.params.d,0,ZOOM_LEVELS.length-1);
      sys(`Zoom: ${ZOOM_LEVELS[World.zoom]}.`); break; }
    case 'life': {
      if(!World.it){ sys("No world yet to seed."); break; }
      World.it.life=true; pushEvent("Life detected.");
      stage(1500,()=>pushEvent("Single cells multiply."));
      stage(3000,()=>pushEvent("Complex organisms emerge."));
      stage(5000,()=>pushEvent("Three civilizations forming."));
      stage(8000,()=>pushEvent("A civilization builds radio telescopes — they are looking outward."));
      stage(10000,()=>{ pushEvent("Signal received on the console:"); sys('  "...who are you?"'); });
      sys("You seed the world with life."); break; }
    case 'planet': { if(!World.bodies.some(b=>b.kind==='planet')){ spawnPlanet(); sys("A world forms."); } else sys("A world already turns here. Try 'add moons' or 'start an ice age'."); break; }
    case 'help':
      dim("Try:  let there be light · create an ocean planet · increase gravity to 2G");
      dim("      add three moons · start an ice age · make the oceans purple");
      dim("      double the size of the sun · create intelligent life");
      dim("      accelerate time · pause · zoom out · undo · save");
      break;
    default:
      dim("Reality strains to understand. (An LLM interpreter would handle this freely.)");
      dim("Type 'help' for what this slice understands.");
  }
}
function hexRGB(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }

function setClimate(type){
  World.climate=type; snapshot();
  const p=World.bodies.find(b=>b.kind==='planet');
  if(type==='ice'){ World.oceanColor='#9fc7e8'; World.landColor='#dfe7ee';
    pushEvent("An ice age begins."); stage(1500,()=>pushEvent("Oceans freeze. Animals migrate."));
    stage(3500,()=>pushEvent("Civilizations falter against the cold."));
    sys("Snow spreads across the continents."); }
  else if(type==='volcanic'){ World.oceanColor='#3a1010'; World.landColor='#2a2228';
    World.skyTint=[30,8,8]; pushEvent("Volcanism reshapes the crust.");
    sys("Black sand, obsidian peaks, rivers of glowing lava."); }
  else if(type==='ocean'){ World.oceanColor='#1f7ab0'; World.landColor='#2e8b6a';
    pushEvent("Waters rise — an ocean world with floating islands.");
    sys("A calm ocean planet takes shape."); }
}

let eventLog=[];
function pushEvent(s){ eventLog.unshift(s); if(eventLog.length>5)eventLog.pop(); sys(s); }

function fmt(n){ if(n>=1e6)return (n/1e6).toFixed(1)+'M'; if(n>=1e3)return (n/1e3).toFixed(0)+'k'; return ''+Math.round(n); }

/* ---------------- Input ---------------- */
input.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const raw=input.value.trim(); if(!raw) return;
  you(raw); input.value='';
  const intent=interpret(raw);
  execute(intent);
});

/* ---------------- Simulation + Render loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  runQueue(now);

  // sim: advance time / age
  if(World.born){ World.age += World.timeScale*dt; }

  /* ---- draw ---- */
  // sky
  const [r,g,b]=World.skyTint;
  const grd=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.8);
  grd.addColorStop(0,`rgb(${r+6},${g+6},${b+10})`);
  grd.addColorStop(1,`rgb(${Math.max(0,r-6)},${Math.max(0,g-6)},${Math.max(0,b-4)})`);
  ctx.fillStyle = World.born? grd : '#000';
  ctx.fillRect(0,0,W,H);

  // genesis light core
  if(World.lightCore){
    const c=World.lightCore;
    c.r = lerp(c.r, c.glow? c.max : 0, 0.04);
    const lg=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(1,c.r));
    lg.addColorStop(0,`rgba(255,255,255,${0.9*c.glow})`);
    lg.addColorStop(0.2,`rgba(220,235,255,${0.5*c.glow})`);
    lg.addColorStop(1,'rgba(180,200,255,0)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
  }

  // stars
  for(const s of World.stars){
    s.tw+=dt*2;
    const a=0.4+0.6*Math.abs(Math.sin(s.tw))*s.z;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.fillRect(s.x*W, s.y*H, s.z*1.6, s.z*1.6);
  }

  // particles
  for(const p of World.particles){
    p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.vy*=.99; p.life-=p.decay;
    const c=p.c||[255,255,255];
    ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${clamp(p.life,0,1)})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
  }
  World.particles=World.particles.filter(p=>p.life>0);

  // bodies
  const planet=World.bodies.find(b=>b.kind==='planet');
  for(const bdy of World.bodies){
    if(bdy.kind==='sun'){
      bdy.r=lerp(bdy.r||0, bdy.baseR, .05);
      const sg=ctx.createRadialGradient(bdy.x,bdy.y,0,bdy.x,bdy.y,bdy.r*2.4);
      sg.addColorStop(0,'rgba(255,220,150,0.95)');
      sg.addColorStop(0.4,'rgba(255,190,90,0.5)');
      sg.addColorStop(1,'rgba(255,160,60,0)');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r*2.4,0,6.28); ctx.fill();
      ctx.fillStyle='#fff6e0'; ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r,0,6.28); ctx.fill();
    }
    if(bdy.kind==='planet'){
      bdy.r=lerp(bdy.r, bdy.baseR, .04);
      bdy.spin += dt*0.3*(World.timeScale>1?2:1);
      // body
      ctx.save(); ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r,0,6.28); ctx.clip();
      ctx.fillStyle=World.oceanColor; ctx.fillRect(bdy.x-bdy.r,bdy.y-bdy.r,bdy.r*2,bdy.r*2);
      // continents (procedural blobs that rotate)
      ctx.fillStyle=World.landColor;
      for(let i=0;i<6;i++){
        const a=bdy.spin + i*1.04;
        const lx=bdy.x+Math.cos(a)*bdy.r*0.45;
        const ly=bdy.y+Math.sin(a*1.3+i)*bdy.r*0.45;
        const rr=bdy.r*(0.28+0.12*Math.sin(i*2.1));
        ctx.beginPath(); ctx.arc(lx,ly,rr,0,6.28); ctx.fill();
      }
      // ice caps
      if(World.climate==='ice'){ ctx.fillStyle='rgba(245,250,255,0.85)';
        ctx.beginPath(); ctx.arc(bdy.x,bdy.y-bdy.r*0.8,bdy.r*0.6,0,6.28); ctx.fill();
        ctx.beginPath(); ctx.arc(bdy.x,bdy.y+bdy.r*0.8,bdy.r*0.6,0,6.28); ctx.fill(); }
      ctx.restore();
      // atmosphere
      const ag=ctx.createRadialGradient(bdy.x,bdy.y,bdy.r*0.9,bdy.x,bdy.y,bdy.r*1.25);
      ag.addColorStop(0,'rgba(160,200,255,0)');
      ag.addColorStop(1,`rgba(140,190,255,${World.climate==='volcanic'?0.0:0.25})`);
      ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r*1.25,0,6.28); ctx.fill();
      // terminator shadow (toward sun)
      const sun=World.bodies.find(b=>b.kind==='sun');
      if(sun){ const ang=Math.atan2(bdy.y-sun.y,bdy.x-sun.x);
        const sh=ctx.createLinearGradient(bdy.x-Math.cos(ang)*bdy.r,bdy.y-Math.sin(ang)*bdy.r,
                                          bdy.x+Math.cos(ang)*bdy.r,bdy.y+Math.sin(ang)*bdy.r);
        sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,10,0.55)');
        ctx.save(); ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r,0,6.28); ctx.clip();
        ctx.fillStyle=sh; ctx.fillRect(bdy.x-bdy.r,bdy.y-bdy.r,bdy.r*2,bdy.r*2); ctx.restore(); }
      // life glow
      if(bdy.life){ ctx.strokeStyle='rgba(120,255,170,0.18)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(bdy.x,bdy.y,bdy.r*1.3,0,6.28); ctx.stroke(); }
    }
  }
  // moons orbit the planet
  if(planet){
    for(const m of World.bodies.filter(b=>b.kind==='moon')){
      const gfac = World.gravity===0? 0 : World.gravity;
      m.ang += m.speed*dt*(0.6+0.4*gfac)*(World.timeScale>1?3:1);
      m.grow=lerp(m.grow,1,.05);
      m.x=planet.x+Math.cos(m.ang)*m.dist;
      m.y=planet.y+Math.sin(m.ang)*m.dist*0.6;
      ctx.fillStyle=m.color; ctx.beginPath(); ctx.arc(m.x,m.y,m.r*m.grow,0,6.28); ctx.fill();
    }
  }

  // gravity==0: drift everything apart slowly
  if(World.gravity===0 && planet){
    planet.x += Math.sin(now/1700)*0.15;
    planet.y += Math.cos(now/2300)*0.15;
  }

  // HUD
  if(World.born){
    zoomEl.textContent = '⟸ '+ZOOM_LEVELS[World.zoom]+' ⟹';
    const civ = planet&&planet.life ? '3' : '0';
    statusEl.innerHTML =
      `gravity <b>${World.gravity}G</b><br>`+
      `time <b>${World.timeScale<=1?'1×':fmt(World.timeScale)+' yr/s'}</b><br>`+
      `age <b>${fmt(World.age)} yr</b><br>`+
      `climate <b>${World.climate}</b><br>`+
      `civilizations <b>${civ}</b>`;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* boot whisper */
setTimeout(()=>{ dim("An endless void. A blinking prompt. Type something — try: let there be light"); }, 800);
</script>
