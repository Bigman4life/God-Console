<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="God Console — a god game where language is the interface. Type reality into existence." />
<title>God Console</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hint">Create.</div>

  <div id="zoom"></div>
  <div id="status"></div>
  <div id="tips">scroll to zoom &nbsp;·&nbsp; Tab to autocomplete &nbsp;·&nbsp; ↑/↓ history &nbsp;·&nbsp; &ldquo;universes&rdquo; / &ldquo;help&rdquo;</div>

  <div id="browser" class="hidden">
    <div class="bro-head">SAVED UNIVERSES <span id="bro-close">×</span></div>
    <div id="bro-list"></div>
    <div class="bro-foot"><input id="bro-name" placeholder="name…" /><button id="bro-save">save current</button></div>
  </div>

  <div id="console">
    <div class="rule">───────────────────────────────────────────────────────────────────────────────</div>
    <div id="log"></div>
    <div id="suggest"></div>
    <div id="promptRow">
      <span class="caret">&gt;</span>
      <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div id="blink"></div>
    </div>
    <div class="rule">───────────────────────────────────────────────────────────────────────────────</div>
  </div>

  <!-- modules load in dependency order as classic scripts (works over file://) -->
  <script src="src/util.js"></script>
  <script src="src/state.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/render.js"></script>
  <script src="src/interpreter.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/companion.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
